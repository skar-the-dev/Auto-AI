name: Deploy Auto AI cloud renderer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "renderer/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install
      - name: Set renderer API secret
        working-directory: renderer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDERER_API_KEY: ${{ secrets.RENDERER_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$RENDERER_API_KEY" || { echo "Missing GitHub Actions secret: RENDERER_API_KEY"; exit 1; }
          printf '%s' "$RENDERER_API_KEY" | npx wrangler secret put RENDERER_API_KEY
      - name: Deploy Cloudflare Container and Worker
        working-directory: renderer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy