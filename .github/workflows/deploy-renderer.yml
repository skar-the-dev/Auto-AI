name: Validate Auto AI video pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - "functions/api/autopilot/**"
      - "functions/api/render.js"
      - "functions/api/jobs.js"
      - "functions/api/ideas.js"
      - "functions/api/accounts.js"
      - ".github/workflows/deploy-renderer.yml"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate renderer and API syntax
        run: |
          python -m py_compile renderer/app.py
          node --check functions/api/autopilot/publish.js
          node --check functions/api/batch.js
          node --check functions/api/render.js
          node --check functions/api/jobs.js
          node --check functions/api/ideas.js
          node --check functions/api/accounts.js
